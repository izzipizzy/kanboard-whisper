name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/test.sh
      - run: docker build -t whisper-test ./whisper-service
      - run: docker run --rm -v "$PWD/tests:/tests:ro" whisper-test python /tests/test_speech.py
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Whisper-plugin
          path: dist/Whisper-*.zip*
